version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      cargo:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/tools"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 3
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types: ["minor", "patch"]
